[project]
name = "bonstok-backend"
version = "0.1.0"
description = "BonStok API - bon barang gudang & stok obat klinik"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "motor==3.3.1",
  "pymongo==4.6.3",
  "dnspython==2.8.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "reportlab>=4.0",
  "openpyxl>=3.1",
  "pymupdf>=1.24",
  "python-docx>=1.1.2",
]

[tool.fastapi]
entrypoint = "server:app"
